        border-radius: 20px;

        max-width: 500px;

        padding: 30px;
        animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    }

        display: none;
    }

    .screen.active {
        display: block;
        animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin: 10px 0;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn:active { transform: translateY(0); }
    .btn-secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .btn-success { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .btn-danger { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

    .lang-toggle {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .lang-btn {
        padding: 10px 25px;
        border: 3px solid #667eea;
        background: white;
        color: #667eea;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
    }

    .lang-btn.active {
        background: #667eea;
        color: white;
    }

    .toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 12px;
        margin: 15px 0;
    }

    .toggle-label {
        font-size: 16px;
        font-weight: bold;
        color: #333;
    }

    .toggle-switch {
        position: relative;
        width: 60px;
        height: 30px;
    }

    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 30px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 22px;
        width: 22px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    input:checked + .slider:before {
        transform: translateX(30px);
    }

    input, select {
        width: 100%;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 16px;
        margin: 10px 0;

    <!-- Home Screen -->
    <div id="homeScreen" class="screen">
        <div class="lang-toggle">
            <button class="lang-btn active" id="langAr" onclick="setLanguage('ar')">العربية</button>
            <button class="lang-btn" id="langEn" onclick="setLanguage('en')">English</button>
        </div>
        <h1>🎭 <span data-t="title"></span></h1>
        <p class="subtitle" data-t="subtitle"></p>
        <button class="btn" onclick="showScreen('sessionsScreen')">📂 <span data-t="mySessions"></span></button>
        <button class="btn btn-secondary" onclick="showScreen('newSessionScreen')">➕ <span data-t="newSession"></span></button>
        <button class="btn btn-success" onclick="showScreen('howToPlayScreen')">❓ <span data-t="howToPlay"></span></button>
    </div>

    <!-- Sessions List Screen -->
    <div id="sessionsScreen" class="screen">
        <h1>📂 <span data-t="mySessions"></span></h1>
        <div id="sessionsList"></div>
        <button class="btn btn-secondary" onclick="showScreen('homeScreen')">🔙 <span data-t="back"></span></button>
    </div>

    <!-- New Session Screen -->
    <div id="newSessionScreen" class="screen">
        <h1>➕ <span data-t="newSession"></span></h1>
        <input type="text" id="sessionName" data-placeholder="sessionNamePlaceholder">
        <h3 style="margin: 20px 0;">👥 <span data-t="playersMin3"></span></h3>
        <input type="text" id="playerNameInput" data-placeholder="playerNamePlaceholder" onkeypress="if(event.key==='Enter') addPlayer()">
        <button class="btn btn-success" onclick="addPlayer()">➕ <span data-t="addPlayer"></span></button>
        <div id="playersList"></div>
        <button class="btn" onclick="createSession()" id="createSessionBtn" disabled>🎮 <span data-t="createSession"></span></button>
        <button class="btn btn-secondary" onclick="showScreen('homeScreen')">🔙 <span data-t="back"></span></button>
    </div>

    <!-- Session Detail Screen -->
    <div id="sessionDetailScreen" class="screen">
        <h1 id="sessionTitle"></h1>
        
        <div class="player-management">
            <h4>👥 <span data-t="managePlayers"></span></h4>
            <input type="text" id="newPlayerInput" data-placeholder="addNewPlayer" onkeypress="if(event.key==='Enter') addPlayerToSession()">
            <button class="btn btn-success btn-small" onclick="addPlayerToSession()">➕ <span data-t="add"></span></button>
        </div>
        
        <div id="sessionPlayers"></div>
        
        <h3 style="margin: 20px 0;">🎯 <span data-t="gameSettings"></span></h3>
        
        <div class="toggle-container">
            <span class="toggle-label">👶 <span data-t="kidsMode"></span></span>
            <label class="toggle-switch">
                <input type="checkbox" id="kidsMode">
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="toggle-container">
            <span class="toggle-label">💡 <span data-t="showHintToImposter"></span></span>
            <label class="toggle-switch">
                <input type="checkbox" id="showHintToImposter" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <label data-t="imposterCount"></label>
        <input type="number" id="imposterCount" min="1" value="1">
        
        <label data-t="category"></label>
        <select id="categorySelect"></select>
        
        <label data-t="timerPerPlayer"></label>
        <select id="timerDuration">
            <option value="0" data-t="noTimer"></option>
            <option value="30">30 <span data-t="seconds"></span></option>
            <option value="60" selected>60 <span data-t="seconds"></span></option>
            <option value="90">90 <span data-t="seconds"></span></option>
            <option value="120">120 <span data-t="seconds"></span></option>
        </select>
        
        <button class="btn" onclick="startGame()">▶️ <span data-t="startGame"></span></button>
        <button class="btn btn-success" onclick="showGameHistory()">📜 <span data-t="gameHistory"></span></button>
        <button class="btn btn-secondary" onclick="resetSessionScores()">🔄 <span data-t="resetScores"></span></button>
        <button class="btn btn-danger" onclick="deleteSession()">🗑️ <span data-t="deleteSession"></span></button>
        <button class="btn btn-secondary" onclick="showScreen('sessionsScreen')">🔙 <span data-t="back"></span></button>
    </div>

    <!-- Game History Screen -->
    <div id="gameHistoryScreen" class="screen">
        <h1>📜 <span data-t="gameHistory"></span></h1>
        <div id="gameHistoryList"></div>
        <button class="btn btn-secondary" onclick="backToSession()">🔙 <span data-t="back"></span></button>
    </div>

    <!-- First Player Selection Screen -->
    <div id="firstPlayerScreen" class="screen">
        <div style="text-align: center; padding: 40px 20px;">
            <h1 style="margin-bottom: 20px;">🎲 <span data-t="whoStarts"></span></h1>
            <p style="font-size: 18px; color: #666; margin-bottom: 30px;" data-t="pressToSelect"></p>
            <button class="btn btn-success" onclick="selectFirstPlayer()" id="selectFirstBtn" style="font-size: 24px;">

    function setLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.body.classList.toggle('en', lang === 'en');
        
        // Update language buttons
        document.getElementById('langAr').classList.toggle('active', lang === 'ar');
        document.getElementById('langEn').classList.toggle('active', lang === 'en');
        
        // Update all translations
        updateTranslations();
        updateCategorySelect();
        
        // Save preference
        localStorage.setItem('imposterGameLang', lang);
        
        // Show home screen if on language screen
        if (document.getElementById('langScreen').classList.contains('active')) {
            showScreen('homeScreen');
        }
    }

    function t(key) {
        return TRANSLATIONS[currentLang][key] || key;
    }

    function updateTranslations() {
        // Update all elements with data-t attribute
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if (TRANSLATIONS[currentLang][key]) {
                el.textContent = TRANSLATIONS[currentLang][key];
            }
        });
        
        // Update placeholders
        document.querySelectorAll('[data-placeholder]').forEach(el => {
            const key = el.getAttribute('data-placeholder');
            if (TRANSLATIONS[currentLang][key]) {
                el.placeholder = TRANSLATIONS[currentLang][key];
            }
        });
        
        // Update how to play content
        const howToPlayContent = document.getElementById('howToPlayContent');
        if (howToPlayContent) {
            howToPlayContent.innerHTML = t('howToPlayContent');
        }
    }

    // ===============================
    // AUDIO SYSTEM
    // ===============================
    const AudioManager = {
        audioContext: null,
        
        init() {
            try {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            } catch(e) {}
        },
        
        playAlert() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 880;
                oscillator.type = 'square';
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            } catch(e) {}
        },
        
        playSuccess() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                [0, 0.15, 0.3].forEach((delay, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 523.25 + (i * 100);
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.2, now + delay + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.15);
                });
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            } catch(e) {}
        },
        
        playDrama() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.setValueAtTime(200, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.8);
                oscillator.type = 'sawtooth';
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                oscillator.start(now);
                oscillator.stop(now + 0.8);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } catch(e) {}
        }
    };

    // ===============================
    // STORAGE
    // ===============================
    const Storage = {
        getSessions() {
            try {
                const sessions = localStorage.getItem('imposterSessions');
                return sessions ? JSON.parse(sessions) : [];
            } catch(e) {
                return [];
            }
        },
        
        saveSession(session) {
            try {
                const sessions = this.getSessions();
                const index = sessions.findIndex(s => s.id === session.id);
                if (index >= 0) {
                    sessions[index] = session;
                } else {
                    sessions.push(session);
                }
                localStorage.setItem('imposterSessions', JSON.stringify(sessions));
            } catch(e) {}
        },
        
        deleteSession(sessionId) {
            try {
                const sessions = this.getSessions();
                const filtered = sessions.filter(s => s.id !== sessionId);
                localStorage.setItem('imposterSessions', JSON.stringify(filtered));
            } catch(e) {}
        },
        
        getSession(sessionId) {
            const sessions = this.getSessions();
            return sessions.find(s => s.id === sessionId);
        }
    };

    // ===============================
    // DATE FORMATTER
    // ===============================
    function formatDate(dateString) {
        try {
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();
            const hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day}/${month}/${year} - ${hours}:${minutes}`;
        } catch(e) {
            return dateString;
        }
    }

    // ===============================
    function addPlayer() {
        const input = document.getElementById('playerNameInput');
        const name = input.value.trim();
        
        if (!name) {
            alert(t('enterPlayerName'));
            return;
        }
        
        if (players.find(p => p.name === name)) {
            alert(t('playerExists'));
            return;
        }
        
        players.push({
            id: Date.now(),
            name: name,
            totalScore: 0,
            gamesPlayed: 0
        });
        
        input.value = '';
        updatePlayersList();
    }

    function removePlayer(playerId) {
        players = players.filter(p => p.id !== playerId);
        updatePlayersList();
    }

    function updatePlayersList() {
        const list = document.getElementById('playersList');
        list.innerHTML = '';
        
        players.forEach(player => {
            const item = document.createElement('div');
            item.className = 'player-item';
            item.innerHTML = `
                <span class="player-name">${player.name}</span>
                <button class="delete-btn" onclick="removePlayer(${player.id})">${t('delete')}</button>
            `;
            list.appendChild(item);
        });
        
        document.getElementById('createSessionBtn').disabled = players.length < 3;
    }

    function createSession() {
        const sessionName = document.getElementById('sessionName').value.trim();
        
        if (!sessionName) {
            alert(t('enterSessionName'));
            return;
        }
        
        if (players.length < 3) {
            alert(t('min3Players'));
            return;
        }
        
        const session = {
            id: Date.now(),
            name: sessionName,
            players: [...players],
            totalGames: 0,
            gameHistory: [],
            createdAt: new Date().toISOString()
        };
        
        Storage.saveSession(session);
        currentSession = session;
        
        players = [];
        document.getElementById('sessionName').value = '';
        document.getElementById('playersList').innerHTML = '';
        
        loadSessionDetail(session.id);
    }

        const sessions = Storage.getSessions();
        const list = document.getElementById('sessionsList');
        
        if (sessions.length === 0) {
            list.innerHTML = `
                <div class="empty-state">

    // ===============================
    // GAME LOGIC
    // ===============================
    function startGame() {
        const imposterCount = parseInt(document.getElementById('imposterCount').value) || 1;
        const category = document.getElementById('categorySelect').value;
        const timerDuration = parseInt(document.getElementById('timerDuration').value) || 0;
        const kidsMode = document.getElementById('kidsMode').checked;
        const showHintToImposter = document.getElementById('showHintToImposter').checked;
        
        if (imposterCount >= currentSession.players.length) {
            alert(t('tooManyImposters'));
            return;
        }
        
        AudioManager.init();
        
        const words = WORDS[category];
        if (!words || words.length === 0) {
            alert(t('noCategoryWords'));
            return;
        }
        
        const selectedWord = words[Math.floor(Math.random() * words.length)];
        
        // Balanced imposter selection - avoid picking same person repeatedly
        const imposters = selectBalancedImposters(imposterCount);
        
        // Get the right word and hint based on language
        const word = currentLang === 'en' ? selectedWord.wordEn : selectedWord.word;
        const hint = kidsMode 
            ? (currentLang === 'en' ? selectedWord.kidsHintEn : selectedWord.kidsHint)
            : (currentLang === 'en' ? selectedWord.hintEn : selectedWord.hint);
        
        currentGame = {
            word: word,
            hint: hint,
            category: category,
            imposters: imposters,
            imposterCount: imposterCount,
            timerDuration: timerDuration,
            kidsMode: kidsMode,
            showHintToImposter: showHintToImposter,
            playerCards: currentSession.players.map(player => ({
                ...player,
                isImposter: imposters.includes(player.id),
                revealed: false
            }))
        };
        
        currentPlayerIndex = 0;
        allVotes = [];
        selectedFirstPlayerIndex = -1;
        
        showFirstPlayerSelection();
    }
    
    // Balanced imposter selection to avoid picking same person repeatedly
    function selectBalancedImposters(count) {
        // Initialize or get imposter history for this session
        if (!currentSession.imposterHistory) {
            currentSession.imposterHistory = {};
            currentSession.players.forEach(p => {
                currentSession.imposterHistory[p.id] = 0;
            });
        }
        
        // Make sure all players are in the history
        currentSession.players.forEach(p => {
            if (currentSession.imposterHistory[p.id] === undefined) {
                currentSession.imposterHistory[p.id] = 0;
            }
        });
        
        // Calculate weights - players who were imposter more get lower weight
        const players = [...currentSession.players];
        const maxCount = Math.max(...Object.values(currentSession.imposterHistory), 1);
        
        // Create weighted list
        let weightedPlayers = [];
        players.forEach(player => {
            const timesImposter = currentSession.imposterHistory[player.id] || 0;
            // Weight is inverse of times they were imposter (more weight = more likely)
            // Someone who was imposter 0 times gets weight 3, 1 time gets 2, 2+ times gets 1
            const weight = Math.max(1, 4 - timesImposter);
            for (let i = 0; i < weight; i++) {
                weightedPlayers.push(player);
            }
        });
        
        // Select imposters from weighted list
        const selectedImposters = [];
        while (selectedImposters.length < count && weightedPlayers.length > 0) {
            const randomIndex = Math.floor(Math.random() * weightedPlayers.length);
            const selected = weightedPlayers[randomIndex];
            
            // Check if already selected
            if (!selectedImposters.includes(selected.id)) {
                selectedImposters.push(selected.id);
                // Remove all instances of this player from weighted list
                weightedPlayers = weightedPlayers.filter(p => p.id !== selected.id);
            }
        }
        
        // Update history
        selectedImposters.forEach(id => {
            currentSession.imposterHistory[id] = (currentSession.imposterHistory[id] || 0) + 1;
        });
        
        // Save session with updated history
        Storage.saveSession(currentSession);
        
        return selectedImposters;
    }

    function startTimer() {
        let totalSeconds = currentGame.timerDuration * currentGame.playerCards.length;
        
        const container = document.getElementById('timerContainer');
        container.innerHTML = `
            <div class="timer-display" id="timerDisplay">${formatTime(totalSeconds)}</div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn" style="flex: 1;" onclick="pauseTimer()">⏸️ ${t('pause')}</button>
                <button class="btn btn-success" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            </div>
        `;
        
        timerInterval = setInterval(() => {
            totalSeconds--;
            const display = document.getElementById('timerDisplay');
            if (display) {
                display.textContent = formatTime(totalSeconds);
                
                if (totalSeconds <= 10) {
                    display.classList.add('warning');
                }
                
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    AudioManager.playAlert();
                    proceedToVoting();
                }
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        const btnContainer = document.querySelector('#timerContainer > div:last-child');
        if (btnContainer) {
            btnContainer.innerHTML = `
                <button class="btn btn-success" style="flex: 1;" onclick="resumeTimer()">▶️ ${t('resume')}</button>
                <button class="btn" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            `;
        }
    }

    function resumeTimer() {
        const display = document.getElementById('timerDisplay');
        if (!display) return;
        
        const timeText = display.textContent;
        const [minutes, seconds] = timeText.split(':').map(Number);
        let totalSeconds = minutes * 60 + seconds;
        
        timerInterval = setInterval(() => {
            totalSeconds--;
            display.textContent = formatTime(totalSeconds);
            
            if (totalSeconds <= 10) {
                display.classList.add('warning');
            }
            
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                AudioManager.playAlert();
                proceedToVoting();
            }
        }, 1000);
        
        const btnContainer = document.querySelector('#timerContainer > div:last-child');
        if (btnContainer) {
            btnContainer.innerHTML = `
                <button class="btn" style="flex: 1;" onclick="pauseTimer()">⏸️ ${t('pause')}</button>
                <button class="btn btn-success" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            `;
        }
    }

    function addTime(seconds) {
        const display = document.getElementById('timerDisplay');
        if (!display) return;
        
        const timeText = display.textContent;
        const [minutes, secs] = timeText.split(':').map(Number);
        let totalSeconds = minutes * 60 + secs + seconds;
        display.textContent = formatTime(totalSeconds);
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function showVotingForPlayer() {

        document.getElementById('currentVoter').textContent = voter.name;
        
        // Check if voter is imposter using their ID
        const voterIsImposter = currentGame.imposters.includes(voter.id);
        currentVotes = [];
        
        // Everyone votes for the same number of players (imposterCount)
        const votesNeeded = currentGame.imposterCount;
        
        const instructionsDiv = document.getElementById('votingInstructions');
        
        if (voterIsImposter) {
            // Show imposter that they are imposter
            instructionsDiv.innerHTML = `
                <div class="imposter-vote-info">
                    🎭 ${t('youAreImposterVote')}
                </div>
                <div class="votes-remaining" style="margin-top: 10px;">
                    ${t('choose')} <strong>${votesNeeded}</strong> ${votesNeeded > 1 ? t('playersYouThink') : t('playerYouThink')}
                </div>
            `;
        } else {
            instructionsDiv.innerHTML = `
                <div class="votes-remaining">
                    ${t('choose')} <strong>${votesNeeded}</strong> ${votesNeeded > 1 ? t('playersYouThink') : t('playerYouThink')}
                </div>
            `;
        }
        
        const grid = document.getElementById('voteGrid');
        grid.innerHTML = '';
        
        // Store votesNeeded in a data attribute for use in toggleVote
        grid.dataset.maxVotes = votesNeeded;
        grid.dataset.voterId = voter.id;
        grid.dataset.voterIsImposter = voterIsImposter ? 'true' : 'false';
        
        currentGame.playerCards.forEach(player => {
            // Regular players don't see their own name
            // Imposters see ALL names including their own (for blending in)
            if (!voterIsImposter && player.id === voter.id) return;
            
            const card = document.createElement('div');
            card.className = 'vote-card';
            card.dataset.playerId = player.id;
            
            // Mark if this is the voter's own card (for imposters)
            const isSelf = player.id === voter.id;
            if (isSelf) {
                card.dataset.isSelf = 'true';
                card.style.borderStyle = 'dashed';
            }
            
            card.onclick = () => toggleVote(card, player.id);
            card.innerHTML = `
                <div class="vote-card-name">${player.name}${isSelf ? ' (أنت)' : ''}</div>
            `;
            grid.appendChild(card);
        });
        
        updateVoteButton();
    }

    function toggleVote(cardElement, playerId) {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        
        if (currentVotes.includes(playerId)) {
            currentVotes = currentVotes.filter(id => id !== playerId);
            cardElement.classList.remove('selected');
        } else {
            if (currentVotes.length < maxVotes) {
                currentVotes.push(playerId);
                cardElement.classList.add('selected');
            } else {
                alert(`${t('canOnlyChoose')} ${maxVotes} ${maxVotes > 1 ? t('playersOnly') : t('playerOnly')}`);
            }
        }
        
        updateVoteButton();
    }

    function updateVoteButton() {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        const btn = document.getElementById('submitVoteBtn');
        
        if (currentVotes.length === maxVotes) {
            btn.disabled = false;
            btn.innerHTML = `✅ ${t('confirmVote')}`;
            btn.style.opacity = '1';
        } else {
            btn.disabled = true;
            const remaining = maxVotes - currentVotes.length;
            btn.innerHTML = `${t('chooseMore')} ${remaining} ${remaining > 1 ? t('morePlayers') : t('morePlayer')}`;
            btn.style.opacity = '0.6';
        }
    }

    function submitCurrentVote() {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        
        if (currentVotes.length !== maxVotes) {
            alert(`${t('pleaseChoose')} ${maxVotes} ${maxVotes > 1 ? t('playersOnly') : t('playerOnly')}`);
            return;
        }
        
        const voter = currentGame.playerCards[currentVoterIndex];
        const voterIsImposter = currentGame.imposters.includes(voter.id);
        
        // Store each vote with full info
        currentVotes.forEach(votedForId => {
            allVotes.push({
                voterId: voter.id,
                voterName: voter.name,
                voterIsImposter: voterIsImposter,
                votedFor: votedForId,
                votedForName: currentGame.playerCards.find(p => p.id === votedForId)?.name || 'Unknown'
            });
        });
        
        currentVotes = [];
        currentVoterIndex++;
        
        if (currentVoterIndex < currentGame.playerCards.length) {
            AudioManager.playAlert();
            
            const nextVoter = currentGame.playerCards[currentVoterIndex];
            const privacyScreen = document.getElementById('privacyScreen');
            const content = privacyScreen.querySelector('.privacy-content');
            
            content.innerHTML = `
                <div class="privacy-icon">🗳️</div>
                <div class="privacy-text">${t('votingTurn')}</div>
                <div class="next-player-name">${nextVoter.name}</div>
                <button class="btn btn-success" style="margin-top: 30px; font-size: 20px;" id="voterReadyBtn">
                    ✅ ${currentLang === 'ar' ? 'أنا' : "I'm"} ${nextVoter.name} - ${t('imReady')}
                </button>
            `;
            
            privacyScreen.classList.add('active');
            
            document.getElementById('voterReadyBtn').onclick = function() {
                privacyScreen.classList.remove('active');
                showVotingForPlayer();
            };
        } else {
            showSuspenseScreen();
        }
    }

    // ===============================
    // SUSPENSE & REVEAL
    // ===============================
    function showSuspenseScreen() {
        showScreen('suspenseScreen');
        AudioManager.playDrama();
        
        const texts = [
            t('whoIsImposter'),
            t('didYouCatch'),
            t('decisiveMoment'),
            t('getReady')
        ];
        
        let textIndex = 0;
        const suspenseInterval = setInterval(() => {
            const textEl = document.getElementById('suspenseText');
            if (textEl) {
                textEl.textContent = texts[textIndex];
            }
            textIndex++;
            if (textIndex >= texts.length) {
                clearInterval(suspenseInterval);
            }
        }, 1500);
    }

    function revealImposter() {
        AudioManager.playDrama();
        
        const container = document.querySelector('.suspense-container');
        container.innerHTML = `<h1>🎭 ${t('imposterWas')}</h1>`;
        
        // Get the actual imposter names from the imposters array
        const imposterNames = [];
        currentGame.imposters.forEach(imposterId => {
            // Search in the original session players, not the reordered playerCards
            const player = currentSession.players.find(p => p.id === imposterId);
            if (player) {
                imposterNames.push(player.name);
            }
        });
        
        setTimeout(() => {
            imposterNames.forEach((imposterName, index) => {
                setTimeout(() => {
                    const revealDiv = document.createElement('div');
                    revealDiv.className = 'reveal-imposter';
                    revealDiv.innerHTML = `<h2 style="font-size: 48px; color: #667eea;">🎭 ${imposterName}!</h2>`;
                    container.appendChild(revealDiv);
                    AudioManager.playAlert();
                }, index * 1000);
            });
            
            setTimeout(() => {
                const continueBtn = document.createElement('button');
                continueBtn.className = 'btn btn-success';
                continueBtn.style.marginTop = '30px';
                continueBtn.innerHTML = `📊 ${t('showResults')}`;
                continueBtn.onclick = calculateResults;
                container.appendChild(continueBtn);
                
                Confetti.create();
            }, (imposterNames.length * 1000) + 500);
        }, 1000);
    }

    // ===============================
    // SCORING
    // ===============================
    function calculateResults() {
        const results = [];
        
        // Count votes against each player (from regular players only, excluding self-votes)
        const regularPlayerVoteCounts = {};
        currentSession.players.forEach(p => {
            regularPlayerVoteCounts[p.id] = 0;
        });
        
        // Debug: log all votes
        console.log('All votes:', allVotes);
        console.log('Imposters:', currentGame.imposters);
        
        allVotes.forEach(vote => {
            // Only count votes from non-imposters, and not voting for themselves
            if (!vote.voterIsImposter && vote.voterId !== vote.votedFor && regularPlayerVoteCounts[vote.votedFor] !== undefined) {
                regularPlayerVoteCounts[vote.votedFor]++;
            }
        });
        
        console.log('Vote counts (regular players only, no self-votes):', regularPlayerVoteCounts);
        
        const regularPlayersCount = currentSession.players.length - currentGame.imposterCount;
        
        currentSession.players.forEach(player => {
            let score = 0;
            let breakdown = [];
            const votesAgainst = regularPlayerVoteCounts[player.id] || 0;
            const isImposter = currentGame.imposters.includes(player.id);
            
            if (isImposter) {
                // Imposter base scoring - only based on votes from regular players
                if (votesAgainst === 0) {
                    score = 30;
                    breakdown.push(`+30 (${t('noOneDoubtedYou')})`);
                } else if (votesAgainst < regularPlayersCount / 2) {
                    score = 20;
                    breakdown.push(`+20 (${t('fewDoubtedYou')})`);
                } else {
                    score = 0;
                    breakdown.push(`+0 (${t('youWereCaught')})`);
                }
                
                // Imposter also gets/loses points for their votes
                const playerVotes = allVotes.filter(v => v.voterId === player.id);
                playerVotes.forEach(vote => {
                    // Skip if voted for self - no points
                    if (vote.votedFor === player.id) {
                        breakdown.push(`0 (${currentLang === 'ar' ? 'صوت لنفسه' : 'Voted for self'})`);
                        return;
                    }
                    
                    const votedForIsImposter = currentGame.imposters.includes(vote.votedFor);
                    if (votedForIsImposter) {
                        // Voted for fellow imposter - bonus!
                        score += 5;
                        breakdown.push(`+5 (${currentLang === 'ar' ? 'صوت لمحتال زميل' : 'Fellow imposter'})`);
                    } else {
                        // Voted for innocent - penalty
                        score -= 5;
                        breakdown.push(`-5 (${t('wrongVoteOnInnocent')})`);
                    }
                });
            } else {
                // Regular player scoring
                const playerVotes = allVotes.filter(v => v.voterId === player.id);
                
                playerVotes.forEach(vote => {
                    // Skip if voted for self
                    if (vote.votedFor === player.id) {
                        // No points for voting for yourself
                        return;
                    }
                    
                    const votedForIsImposter = currentGame.imposters.includes(vote.votedFor);
                    if (votedForIsImposter) {
                        score += 10;
                        breakdown.push(`+10 (${t('correctVoteOnImposter')})`);
                    } else {
                        score -= 5;
                        breakdown.push(`-5 (${t('wrongVoteOnInnocent')})`);
                    }
                });
                
                // If no valid votes were recorded for this player
                if (breakdown.length === 0) {
                    breakdown.push(`0`);
                }
            }
            
            // Update session player score
            const sessionPlayer = currentSession.players.find(p => p.id === player.id);
            if (sessionPlayer) {
                sessionPlayer.totalScore = (sessionPlayer.totalScore || 0) + score;
                sessionPlayer.gamesPlayed = (sessionPlayer.gamesPlayed || 0) + 1;
            }
            
            results.push({
                id: player.id,
                name: player.name,
                isImposter: isImposter,
                score: score,
                breakdown: breakdown,
                votesAgainst: votesAgainst
            });
        });
        
        currentGame.gameScores = results.map(r => ({ id: r.id, score: r.score }));
        
        // Calculate who won (based on regular player votes only)
        const impostersCaught = currentGame.imposters.filter(id => {
            const votes = regularPlayerVoteCounts[id] || 0;
            return votes >= regularPlayersCount / 2;
        }).length;
        
        const winner = impostersCaught >= currentGame.imposterCount / 2 
            ? (currentLang === 'ar' ? 'اللاعبون العاديون' : 'Regular Players')
            : (currentLang === 'ar' ? 'المحتالون' : 'Imposters');
        
        currentSession.totalGames = (currentSession.totalGames || 0) + 1;
        if (!currentSession.gameHistory) currentSession.gameHistory = [];
        currentSession.gameHistory.push({
            timestamp: new Date().toISOString(),
            category: currentGame.category,
            imposterCount: currentGame.imposterCount,
            winner: winner,
            word: currentGame.word
        });
        
        Storage.saveSession(currentSession);
        
        showResults(results, winner);
    }

    function showResults(results, winner) {
        showScreen('resultsScreen');
        
        const playersWon = winner === (currentLang === 'ar' ? 'اللاعبون العاديون' : 'Regular Players');
        
        if (playersWon) {
            Confetti.create();
        }
        
        const imposters = results.filter(r => r.isImposter);
        const sorted = [...results].sort((a, b) => b.score - a.score);
        
        let html = `
            <div class="winner-banner" style="${!playersWon ? 'background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);' : ''}">
                ${playersWon ? `🎉 ${t('playersWon')}` : `😈 ${t('impostersWon')}`}
            </div>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; margin: 15px 0;">
                <h4 style="margin-bottom: 10px;">📝 ${t('theWordWas')}</h4>
                <div style="font-size: 28px; font-weight: bold; color: #667eea;">${currentGame.word}</div>
            </div>
            
            <h3 style="margin: 20px 0;">🎭 ${t('imposters')}</h3>
            ${imposters.map(i => `
                <div class="player-item" style="background: ${i.score > 0 ? '#e8f5e9' : '#ffebee'};">
                    <span class="player-name">${i.name} 🎭</span>
                    <div style="text-align: ${currentLang === 'ar' ? 'left' : 'right'};">
                        <span style="color: #999; font-size: 12px; display: block;">
                            ${i.votesAgainst} ${t('votesAgainst')}
                        </span>
                        <span style="color: ${i.score > 0 ? '#4caf50' : '#ff0844'}; font-weight: bold;">
                            ${i.score >= 0 ? '+' : ''}${i.score} ${t('point')}
                        </span>
                    </div>
                </div>
            `).join('')}
            
            <h3 style="margin: 20px 0;">📊 ${t('roundScores')}</h3>
            <div class="score-list">
                ${sorted.map((player, index) => {
                    const rank = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    return `
                        <div class="score-item">
                            <span class="score-rank">${rank}</span>
                            <span class="score-name">
                                ${player.name}
                                ${player.isImposter ? '🎭' : ''}
                                <span class="score-breakdown">${player.breakdown.join(' | ')}</span>
                            </span>
                            <span class="score-points" style="color: ${player.score >= 0 ? '#27ae60' : '#e74c3c'};">
                                ${player.score >= 0 ? '+' : ''}${player.score}
                            </span>
                        </div>
                    `;
                }).join('')}
            </div>
            
            <h3 style="margin: 20px 0;">🏆 ${t('totalRanking')}</h3>
            <div class="score-list">
                ${[...currentSession.players]
                    .sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0))
                    .map((player, index) => {
                        const rank = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                        const totalScore = player.totalScore || 0;
                        return `
                            <div class="score-item">
                                <span class="score-rank">${rank}</span>
                                <span class="score-name">${player.name}</span>
                                <span class="score-points" style="color: ${totalScore >= 0 ? '#667eea' : '#e74c3c'};">
                                    ${totalScore} ${t('point')}
                                </span>
                            </div>
                        `;
                    }).join('')}
            </div>
        `;
        
        document.getElementById('resultsContent').innerHTML = html;
    }

    function playAgain() {
        loadSessionDetail(currentSession.id);
    }

    function endSession() {
        currentSession = null;
        currentGame = null;
        showScreen('sessionsScreen');
    }

    // ===============================
    // INITIALIZE
    // ===============================
    window.addEventListener('load', () => {
        // Check for saved language preference
        const savedLang = localStorage.getItem('imposterGameLang');
        if (savedLang) {
            currentLang = savedLang;
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.toggle('en', savedLang === 'en');
            updateTranslations();
            updateCategorySelect();
            showScreen('homeScreen');
        } else {
            showScreen('langScreen');
        }
    });
    
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.log('Error: ' + msg);
        return true;
    };
</script>

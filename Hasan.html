    /* Small unobtrusive abort/back control pinned to top-left of a screen.
       Stays out of the player's interaction area so it isn't tapped by mistake. */
    .btn-abort-corner {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,0.18);

        opacity: 0.55;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 10;
    }
    .btn-abort-corner:hover, .btn-abort-corner:focus {
        opacity: 1;
        transform: scale(1.08);
        outline: none;
    }
    body.dark .btn-abort-corner { background: rgba(255,255,255,0.15); color: #eaeaea; }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 30px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 22px;
        width: 22px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);

    input:checked + .slider:before {
        transform: translateX(30px);
    }

    /* ===== Toast Notifications ===== */
    #toastContainer {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        pointer-events: none;
        max-width: 90vw;
    }
    .toast {
        background: #333;
        color: white;
        padding: 14px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: bold;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        animation: toastIn 0.3s ease-out;
        pointer-events: auto;
        max-width: 400px;
        text-align: center;
    }
    .toast.success { background: linear-gradient(135deg, #4caf50, #2e7d32); }
    .toast.error { background: linear-gradient(135deg, #e94560, #c0392b); }
    .toast.warning { background: linear-gradient(135deg, #ff9800, #e65100); }
    .toast.info { background: linear-gradient(135deg, #667eea, #764ba2); }
    .toast.achievement { background: linear-gradient(135deg, #ffd700, #ff8f00); color: #1a1a2e; }
    .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
    @keyframes toastIn {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-30px); }
    }

                        <p><strong>🕵️ Double Agent:</strong></p>
                        <p>One player gets a special role — they know the word <em>and</em> know who the imposter is. Their mission: subtly help the imposter escape detection. <span class="positive">+15 points</span> if they succeed, <span class="negative">-10</span> if exposed.</p>

        clear() { this._words = null; this._unlocked = false; },
        async tryUnlock(password) {
            if (this._unlocked) return true;
            if (!password) throw new Error('empty');
            const b64ToBytes = (b64) => {
                const bin = atob(b64);
                const out = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
                return out;

                const ct = b64ToBytes(HASAN_VAULT.c);
                const keyMat = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                const key = await subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations: HASAN_VAULT.iter || 200000, hash: 'SHA-256' },
                    keyMat,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']

                const plain = await subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
                const json = new TextDecoder().decode(plain);
                this._words = JSON.parse(json);
                this._unlocked = true;
                return true;
            } catch (e) {
                this._unlocked = false;
                this._words = null;
                return false;
            }
        }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Collision-resistant id: timestamp + random suffix so rapid adds

    function makeId() {

    const AudioManager = {
        audioContext: null,
        
        init() {
            try {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            } catch(e) {}
        },
        
        playAlert() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 880;
                oscillator.type = 'square';
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            } catch(e) {}
        },
        
        playSuccess() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                [0, 0.15, 0.3].forEach((delay, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 523.25 + (i * 100);
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0, now + delay);
                    gain.gain.linearRampToValueAtTime(0.2, now + delay + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.15);
                });
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            } catch(e) {}
        },
        
        playDrama() {
            try {
                this.init();
                if (!this.audioContext) return;
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.setValueAtTime(200, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.8);
                oscillator.type = 'sawtooth';
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                oscillator.start(now);
                oscillator.stop(now + 0.8);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } catch(e) {}
        }
    };

    const Storage = {
        getSessions() {
            try {
                const sessions = localStorage.getItem('imposterSessions');
                return sessions ? JSON.parse(sessions) : [];
            } catch(e) {
                return [];
            }
        },
        
        saveSession(session) {
            try {
                const sessions = this.getSessions();
                const index = sessions.findIndex(s => s.id === session.id);
                if (index >= 0) {
                    sessions[index] = session;
                } else {
                    sessions.push(session);
                }
                localStorage.setItem('imposterSessions', JSON.stringify(sessions));
            } catch(e) {}
        },
        
        deleteSession(sessionId) {
            try {
                const sessions = this.getSessions();
                const filtered = sessions.filter(s => s.id !== sessionId);
                localStorage.setItem('imposterSessions', JSON.stringify(filtered));
            } catch(e) {}
        },
        
        getSession(sessionId) {
            const sessions = this.getSessions();
            return sessions.find(s => String(s.id) === String(sessionId));
        },

        // Generic key-value helpers
        get(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v ? JSON.parse(v) : fallback;
            } catch(e) { return fallback; }
        },
        set(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
        },
        getRaw(key, fallback) {
            try { return localStorage.getItem(key) || fallback; } catch(e) { return fallback; }
        },
        setRaw(key, value) {
            try { localStorage.setItem(key, value); } catch(e) {}
        }
    };

    const CustomCategories = {
        _key: 'imposterCustomCategories',
        list() { return Storage.get(this._key, []) || []; },
        save(arr) { Storage.set(this._key, arr); },
        get(id) { return this.list().find(c => c.id === id); },
        upsert(cat) {
            const list = this.list();
            const idx = list.findIndex(c => c.id === cat.id);
            if (idx >= 0) list[idx] = cat; else list.push(cat);
            this.save(list);
        },
        delete(id) {
            this.save(this.list().filter(c => c.id !== id));
        },
        toWordList(cat) {
            return (cat.words || []).map(w => ({
                word: w.wordAr || w.wordEn || '',
                wordEn: w.wordEn || w.wordAr || '',
                hint: w.hintAr || w.hintEn || (cat.nameAr || cat.nameEn || ''),
                hintEn: w.hintEn || w.hintAr || (cat.nameEn || cat.nameAr || ''),
                kidsHint: w.hintAr || w.hintEn || '',
                kidsHintEn: w.hintEn || w.hintAr || '',
                difficulty: w.difficulty || cat.difficulty || 'medium'
            }));
        }
    };

    // Build word list for a category id (supports "custom:ID" and "__mixed__")
    function getWordsForCategory(catId, selectedCats) {
        if (catId === 'hasan') {
            return HasanVault.isUnlocked() ? HasanVault.getWords() : [];
        }
        if (catId === '__mixed__') {
            // selectedCats is an array of category ids; default to all built-in
            const cats = selectedCats && selectedCats.length ? selectedCats : Object.keys(WORDS);
            const merged = [];
            cats.forEach(c => {
                const list = getWordsForCategory(c);
                list.forEach(w => merged.push(w));
            });
            return merged;
        }
        if (typeof catId === 'string' && catId.startsWith('custom:')) {
            const id = catId.slice(7);
            // ids may be numbers (makeId) or strings; compare loosely
            const cat = CustomCategories.list().find(c => String(c.id) === String(id));
            return cat ? CustomCategories.toWordList(cat) : [];
        }
        return WORDS[catId] || [];
    }

    // ===============================
    // ACHIEVEMENTS
    // ===============================
    const ACHIEVEMENTS = [
        { id: 'firstGame', icon: '🎮', condition: s => (s.global.totalGames || 0) >= 1 },
        { id: 'mastermind', icon: '🧠', condition: s => (s.global.escapesAsImposter || 0) >= 5 },
        { id: 'detective', icon: '🔍', condition: s => (s.global.correctImposterVotes || 0) >= 10 },
        { id: 'untouchable', icon: '💎', condition: s => (s.global.maxImposterEscapeStreak || 0) >= 3 },
        { id: 'sharpEye', icon: '👁️', condition: s => (s.global.maxCorrectVoteStreak || 0) >= 5 },
        { id: 'veteran', icon: '🎖️', condition: s => (s.global.totalGames || 0) >= 50 },
        { id: 'polyglot', icon: '🌍', condition: s => (s.global.playedArabic && s.global.playedEnglish) },
        { id: 'trickster', icon: '🃏', condition: s => (s.global.escapesWithZeroVotes || 0) >= 1 },
        { id: 'comeback', icon: '⚡', condition: s => (s.global.comebacks || 0) >= 1 },
        { id: 'social', icon: '🤝', condition: s => (s.global.maxUniquePlayersInSession || 0) >= 8 },
        { id: 'perfectGame', icon: '⭐', condition: s => (s.global.bestSingleGameScore || 0) >= 30 },
        { id: 'oracle', icon: '🔮', condition: s => (s.global.correctReverseGuesses || 0) >= 1 },
        { id: 'partyAnimal', icon: '🎉', condition: s => (s.global.modesPlayed || []).length >= GAME_MODES.length }
    ];

    const Achievements = {
        _key: 'imposterAchievements',
        load() {
            return Storage.get(this._key, { unlocked: {}, global: { modesPlayed: [] } }) ||
                   { unlocked: {}, global: { modesPlayed: [] } };
        },
        save(state) { Storage.set(this._key, state); },
        recordGame(stats) {
            const s = this.load();
            s.global = s.global || { modesPlayed: [] };
            s.global.totalGames = (s.global.totalGames || 0) + 1;
            if (stats.language === 'ar') s.global.playedArabic = true;
            if (stats.language === 'en') s.global.playedEnglish = true;
            if (stats.mode && !(s.global.modesPlayed || []).includes(stats.mode)) {
                s.global.modesPlayed = [...(s.global.modesPlayed || []), stats.mode];
            }
            if (stats.escapedAsImposter) {
                s.global.escapesAsImposter = (s.global.escapesAsImposter || 0) + 1;
                s.global.imposterEscapeStreak = (s.global.imposterEscapeStreak || 0) + 1;
                s.global.maxImposterEscapeStreak = Math.max(s.global.maxImposterEscapeStreak || 0, s.global.imposterEscapeStreak);
                if (stats.zeroVotesAgainst) s.global.escapesWithZeroVotes = (s.global.escapesWithZeroVotes || 0) + 1;
            } else if (stats.wasImposter) {
                s.global.imposterEscapeStreak = 0;
            }
            if (stats.correctImposterVotes) {
                s.global.correctImposterVotes = (s.global.correctImposterVotes || 0) + stats.correctImposterVotes;
            }
            if (stats.allVotesCorrect) {
                s.global.correctVoteStreak = (s.global.correctVoteStreak || 0) + 1;
                s.global.maxCorrectVoteStreak = Math.max(s.global.maxCorrectVoteStreak || 0, s.global.correctVoteStreak);
            } else {
                s.global.correctVoteStreak = 0;
            }
            if (stats.bestScore) {
                s.global.bestSingleGameScore = Math.max(s.global.bestSingleGameScore || 0, stats.bestScore);
            }
            if (stats.uniquePlayersInSession) {
                s.global.maxUniquePlayersInSession = Math.max(s.global.maxUniquePlayersInSession || 0, stats.uniquePlayersInSession);
            }
            if (stats.correctReverseGuess) {
                s.global.correctReverseGuesses = (s.global.correctReverseGuesses || 0) + 1;
            }
            if (stats.lossStreak !== undefined) {
                if (stats.lossStreak === 0 && (s.global.lossStreak || 0) >= 3) {
                    s.global.comebacks = (s.global.comebacks || 0) + 1;
                }
                s.global.lossStreak = stats.lossStreak;
            }
            // Check for newly unlocked
            const newlyUnlocked = [];
            ACHIEVEMENTS.forEach(a => {
                if (!s.unlocked[a.id]) {
                    try {
                        if (a.condition(s)) {
                            s.unlocked[a.id] = new Date().toISOString();
                            newlyUnlocked.push(a);
                        }
                    } catch (e) {}
                }
            });
            this.save(s);
            return newlyUnlocked;
        },
        unlockedCount() {
            const s = this.load();
            return Object.keys(s.unlocked || {}).length;
        },
        notifyUnlocks(list) {
            list.forEach((a, idx) => {
                setTimeout(() => {
                    Toast.achievement(`${a.icon} ${t('achievementUnlocked')}<br><strong>${escapeHtml(t('ach_' + a.id + '_name'))}</strong>`);
                    AudioManager.playSuccess();
                    Confetti.create();
                }, idx * 800);
            });
        }
    };

    // ===============================

    // ===============================
    function formatDate(dateString) {
        try {
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();
            const hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day}/${month}/${year} - ${hours}:${minutes}`;
        } catch(e) {
            return dateString;
        }
    }

    // ===============================
    // GAME LOGIC
    // ===============================
    function startGame() {
        const imposterCount = parseInt(document.getElementById('imposterCount').value) || 1;
        const category = document.getElementById('categorySelect').value;
        const timerDuration = parseInt(document.getElementById('timerDuration').value) || 0;
        const kidsMode = document.getElementById('kidsMode').checked;
        const showHintToImposter = document.getElementById('showHintToImposter').checked;
        const difficulty = (document.getElementById('difficultySelect') && document.getElementById('difficultySelect').value) || 'any';
        const gameMode = currentSession.gameMode || 'classic';

        if (imposterCount >= currentSession.players.length) {
            Toast.error(t('tooManyImposters'));
            return;
        }

        // Gate Hasan category behind password
        if (category === 'hasan' && !HasanVault.isUnlocked()) {
            promptHasanUnlock(() => startGame());
            return;
        }

        AudioManager.init();

        let words = getWordsForCategory(category);
        if (difficulty !== 'any') {
            const filtered = words.filter(w => (w.difficulty || 'medium') === difficulty);
            if (filtered.length > 0) words = filtered;
        }
        if (!words || words.length === 0) {
            Toast.error(t('noCategoryWords'));
            return;
        }

        // Show tutorial first time
        if (gameMode !== 'classic' && !tutorialSeen(gameMode)) {
            showModeTutorial(gameMode, () => _continueStartGame(words, imposterCount, category, timerDuration, kidsMode, showHintToImposter, gameMode, difficulty));
            return;
        }
        _continueStartGame(words, imposterCount, category, timerDuration, kidsMode, showHintToImposter, gameMode, difficulty);
    }

    function _continueStartGame(words, imposterCount, category, timerDuration, kidsMode, showHintToImposter, gameMode, difficulty) {
        const selectedWord = words[Math.floor(Math.random() * words.length)];

        const imposters = selectBalancedImposters(imposterCount);
        const realImposterCount = imposters.length;

        // Get word/hint in current language
        const word = currentLang === 'en' ? (selectedWord.wordEn || selectedWord.word) : (selectedWord.word || selectedWord.wordEn);
        const hint = kidsMode
            ? (currentLang === 'en' ? (selectedWord.kidsHintEn || selectedWord.hintEn) : (selectedWord.kidsHint || selectedWord.hint))
            : (currentLang === 'en' ? (selectedWord.hintEn || selectedWord.hint) : (selectedWord.hint || selectedWord.hintEn));

        // Mode-specific role assignments
        let doubleAgentId = null;
        let fakeImposterIds = [];
        if (gameMode === 'doubleAgent') {
            const nonImposters = currentSession.players.filter(p => !imposters.includes(p.id));
            if (nonImposters.length > 0) {
                doubleAgentId = nonImposters[Math.floor(Math.random() * nonImposters.length)].id;
            }
        }
        if (gameMode === 'fakeImposters') {
            const nonImposters = currentSession.players.filter(p => !imposters.includes(p.id));
            // 1 or 2 fake imposters depending on group size
            const fakeCount = nonImposters.length >= 4 ? 2 : 1;
            const shuffled = nonImposters.sort(() => Math.random() - 0.5);
            fakeImposterIds = shuffled.slice(0, Math.min(fakeCount, nonImposters.length)).map(p => p.id);
        }

        currentGame = {
            word: word,
            _wordAr: selectedWord.word,
            _wordEn: selectedWord.wordEn,
            hint: hint,
            category: category,
            difficulty: difficulty,
            mode: gameMode,
            imposters: imposters,
            imposterCount: realImposterCount,
            doubleAgentId: doubleAgentId,
            fakeImposterIds: fakeImposterIds,
            timerDuration: timerDuration,
            kidsMode: kidsMode,

            playerCards: currentSession.players.map(player => ({
                ...player,

                isFakeImposter: fakeImposterIds.includes(player.id),
                revealed: false
            })),

            skipVoters: []
        };

        // Persist last-used settings on session
        currentSession.gameMode = gameMode;
        currentSession.difficulty = difficulty;
        currentSession.lastUsedSettings = {
            imposterCount, category, timerDuration, kidsMode, showHintToImposter, gameMode, difficulty
        };

    // Balanced imposter selection to avoid picking same person repeatedly
    function selectBalancedImposters(count) {
        // Initialize or get imposter history for this session
        if (!currentSession.imposterHistory) {
            currentSession.imposterHistory = {};
            currentSession.players.forEach(p => {
                currentSession.imposterHistory[p.id] = 0;
            });
        }
        
        // Make sure all players are in the history
        currentSession.players.forEach(p => {
            if (currentSession.imposterHistory[p.id] === undefined) {
                currentSession.imposterHistory[p.id] = 0;
            }
        });
        
        // Calculate weights - players who were imposter more get lower weight
        const players = [...currentSession.players];
        const maxCount = Math.max(...Object.values(currentSession.imposterHistory), 1);
        
        // Create weighted list
        let weightedPlayers = [];
        players.forEach(player => {
            const timesImposter = currentSession.imposterHistory[player.id] || 0;
            // Weight is inverse of times they were imposter (more weight = more likely)
            // Someone who was imposter 0 times gets weight 3, 1 time gets 2, 2+ times gets 1
            const weight = Math.max(1, 4 - timesImposter);
            for (let i = 0; i < weight; i++) {
                weightedPlayers.push(player);
            }
        });
        
        // Select imposters from weighted list
        const selectedImposters = [];
        while (selectedImposters.length < count && weightedPlayers.length > 0) {
            const randomIndex = Math.floor(Math.random() * weightedPlayers.length);
            const selected = weightedPlayers[randomIndex];
            
            // Check if already selected
            if (!selectedImposters.includes(selected.id)) {
                selectedImposters.push(selected.id);
                // Remove all instances of this player from weighted list
                weightedPlayers = weightedPlayers.filter(p => p.id !== selected.id);
            }
        }
        
        // Update history
        selectedImposters.forEach(id => {
            currentSession.imposterHistory[id] = (currentSession.imposterHistory[id] || 0) + 1;
        });
        
        // Save session with updated history
        Storage.saveSession(currentSession);
        
        return selectedImposters;
    }

    function startTimer() {
        let totalSeconds = currentGame.timerDuration * currentGame.playerCards.length;
        
        const container = document.getElementById('timerContainer');
        container.innerHTML = `
            <div class="timer-display" id="timerDisplay">${formatTime(totalSeconds)}</div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn" style="flex: 1;" onclick="pauseTimer()">⏸️ ${t('pause')}</button>
                <button class="btn btn-success" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            </div>
        `;
        
        timerInterval = setInterval(() => {
            totalSeconds--;
            const display = document.getElementById('timerDisplay');
            if (display) {
                display.textContent = formatTime(totalSeconds);
                
                if (totalSeconds <= 10) {
                    display.classList.add('warning');
                }
                
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    AudioManager.playAlert();
                    proceedToVoting();
                }
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        const btnContainer = document.querySelector('#timerContainer > div:last-child');
        if (btnContainer) {
            btnContainer.innerHTML = `
                <button class="btn btn-success" style="flex: 1;" onclick="resumeTimer()">▶️ ${t('resume')}</button>
                <button class="btn" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            `;
        }
    }

    function resumeTimer() {
        const display = document.getElementById('timerDisplay');
        if (!display) return;
        
        const timeText = display.textContent;
        const [minutes, seconds] = timeText.split(':').map(Number);
        let totalSeconds = minutes * 60 + seconds;
        
        timerInterval = setInterval(() => {
            totalSeconds--;
            display.textContent = formatTime(totalSeconds);
            
            if (totalSeconds <= 10) {
                display.classList.add('warning');
            }
            
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                AudioManager.playAlert();
                proceedToVoting();
            }
        }, 1000);
        
        const btnContainer = document.querySelector('#timerContainer > div:last-child');
        if (btnContainer) {
            btnContainer.innerHTML = `
                <button class="btn" style="flex: 1;" onclick="pauseTimer()">⏸️ ${t('pause')}</button>
                <button class="btn btn-success" style="flex: 1;" onclick="addTime(30)">${t('add30s')}</button>
            `;
        }
    }

    function addTime(seconds) {
        const display = document.getElementById('timerDisplay');
        if (!display) return;
        
        const timeText = display.textContent;
        const [minutes, secs] = timeText.split(':').map(Number);
        let totalSeconds = minutes * 60 + secs + seconds;
        display.textContent = formatTime(totalSeconds);
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function showVotingForPlayer() {
        showScreen('votingScreen');
        
        const voter = currentGame.playerCards[currentVoterIndex];
        document.getElementById('currentVoter').textContent = voter.name;
        
        // Check if voter is imposter using their ID
        const voterIsImposter = currentGame.imposters.includes(voter.id);
        currentVotes = [];
        
        // Everyone votes for the same number of players (imposterCount)
        const votesNeeded = currentGame.imposterCount;
        
        const instructionsDiv = document.getElementById('votingInstructions');
        
        if (voterIsImposter) {
            // Show imposter that they are imposter
            instructionsDiv.innerHTML = `
                <div class="imposter-vote-info">
                    🎭 ${t('youAreImposterVote')}
                </div>
                <div class="votes-remaining" style="margin-top: 10px;">
                    ${t('choose')} <strong>${votesNeeded}</strong> ${votesNeeded > 1 ? t('playersYouThink') : t('playerYouThink')}
                </div>
            `;
        } else {
            instructionsDiv.innerHTML = `
                <div class="votes-remaining">
                    ${t('choose')} <strong>${votesNeeded}</strong> ${votesNeeded > 1 ? t('playersYouThink') : t('playerYouThink')}
                </div>
            `;
        }
        
        const grid = document.getElementById('voteGrid');
        grid.innerHTML = '';
        
        // Store votesNeeded in a data attribute for use in toggleVote
        grid.dataset.maxVotes = votesNeeded;
        grid.dataset.voterId = voter.id;
        grid.dataset.voterIsImposter = voterIsImposter ? 'true' : 'false';
        
        currentGame.playerCards.forEach(player => {
            // Regular players don't see their own name
            // Imposters see ALL names including their own (for blending in)
            if (!voterIsImposter && player.id === voter.id) return;
            
            const card = document.createElement('div');
            card.className = 'vote-card';
            card.dataset.playerId = player.id;
            
            // Mark if this is the voter's own card (for imposters)
            const isSelf = player.id === voter.id;
            if (isSelf) {
                card.dataset.isSelf = 'true';
                card.style.borderStyle = 'dashed';
            }
            
            card.onclick = () => toggleVote(card, player.id);
            const youLabel = currentLang === 'ar' ? ' (أنت)' : ' (you)';
            card.innerHTML = `
                <div class="vote-card-name">${escapeHtml(player.name)}${isSelf ? youLabel : ''}</div>
            `;
            grid.appendChild(card);
        });
        
        updateVoteButton();
    }

    function toggleVote(cardElement, playerId) {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        
        if (currentVotes.includes(playerId)) {
            currentVotes = currentVotes.filter(id => id !== playerId);
            cardElement.classList.remove('selected');
        } else {
            if (currentVotes.length < maxVotes) {
                currentVotes.push(playerId);
                cardElement.classList.add('selected');
            } else {
                Toast.warning(`${t('canOnlyChoose')} ${maxVotes} ${maxVotes > 1 ? t('playersOnly') : t('playerOnly')}`);
            }
        }
        
        updateVoteButton();
    }

    function updateVoteButton() {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        const btn = document.getElementById('submitVoteBtn');
        
        if (currentVotes.length === maxVotes) {
            btn.disabled = false;
            btn.innerHTML = `✅ ${t('confirmVote')}`;
            btn.style.opacity = '1';
        } else {
            btn.disabled = true;
            const remaining = maxVotes - currentVotes.length;
            btn.innerHTML = `${t('chooseMore')} ${remaining} ${remaining > 1 ? t('morePlayers') : t('morePlayer')}`;
            btn.style.opacity = '0.6';
        }
    }

    function submitCurrentVote() {
        const grid = document.getElementById('voteGrid');
        const maxVotes = parseInt(grid.dataset.maxVotes) || 1;
        
        if (currentVotes.length !== maxVotes) {
            Toast.warning(`${t('pleaseChoose')} ${maxVotes} ${maxVotes > 1 ? t('playersOnly') : t('playerOnly')}`);
            return;
        }
        
        const voter = currentGame.playerCards[currentVoterIndex];
        const voterIsImposter = currentGame.imposters.includes(voter.id);
        
        // Store each vote with full info
        currentVotes.forEach(votedForId => {
            allVotes.push({
                voterId: voter.id,
                voterName: voter.name,
                voterIsImposter: voterIsImposter,
                votedFor: votedForId,
                votedForName: currentGame.playerCards.find(p => p.id === votedForId)?.name || 'Unknown'
            });
        });
        
        currentVotes = [];
        currentVoterIndex++;
        
        if (currentVoterIndex < currentGame.playerCards.length) {
            AudioManager.playAlert();
            
            const nextVoter = currentGame.playerCards[currentVoterIndex];
            const privacyScreen = document.getElementById('privacyScreen');
            const content = privacyScreen.querySelector('.privacy-content');
            
            content.innerHTML = `
                <div class="privacy-icon">🗳️</div>
                <div class="privacy-text">${t('votingTurn')}</div>
                <div class="next-player-name">${escapeHtml(nextVoter.name)}</div>
                <button class="btn btn-success" style="margin-top: 30px; font-size: 20px;" id="voterReadyBtn">
                    ✅ ${currentLang === 'ar' ? 'أنا' : "I'm"} ${escapeHtml(nextVoter.name)} - ${t('imReady')}
                </button>
            `;
            
            privacyScreen.classList.add('active');
            
            document.getElementById('voterReadyBtn').onclick = function() {
                privacyScreen.classList.remove('active');
                showVotingForPlayer();
            };
        } else {
            showSuspenseScreen();
        }

    // SUSPENSE & REVEAL
    // ===============================
    function showSuspenseScreen() {
        showScreen('suspenseScreen');
        AudioManager.playDrama();

        // Always rebuild the suspense container so stale reveal data from
        // a previous round doesn't leak into the new one.
        const container = document.querySelector('.suspense-container');
        container.innerHTML = `
            <h1>🎭 ${t('momentOfTruth')}</h1>
            <div class="suspense-text" id="suspenseText"></div>
            <button class="btn btn-danger" id="revealBtn" onclick="revealImposter()" style="font-size: 24px; padding: 20px;">
                🔍 ${t('revealImposter')}
            </button>
        `;

        const texts = [
            t('whoIsImposter'),
            t('didYouCatch'),
            t('decisiveMoment'),
            t('getReady')
        ];

        let textIndex = 0;
        const suspenseInterval = setInterval(() => {
            const textEl = document.getElementById('suspenseText');
            if (!textEl) {
                clearInterval(suspenseInterval);
                return;
            }
            textEl.textContent = texts[textIndex];
            textIndex++;
            if (textIndex >= texts.length) {

    function revealImposter() {
        AudioManager.playDrama();

        const container = document.querySelector('.suspense-container');

        // Build imposter list from the *current* round only, deduped by id,
        // resolved against the live session players (handles renames).
        const seenIds = new Set();
        const imposters = [];
        (currentGame.imposters || []).forEach(imposterId => {
            if (seenIds.has(imposterId)) return;
            seenIds.add(imposterId);
            const player = currentSession.players.find(p => p.id === imposterId)
                || currentGame.playerCards.find(p => p.id === imposterId);
            if (player) {
                imposters.push({ id: imposterId, name: player.name });
            }
        });

        const total = imposters.length;
        const isMulti = total > 1;

        container.innerHTML = `
            <h1>🎭 ${t('imposterWas')}${isMulti ? ` (${total})` : ''}</h1>
            <div class="reveal-imposters-list" id="revealImpostersList"></div>
            <div id="revealActions" style="margin-top: 20px;"></div>
        `;

        const listEl = document.getElementById('revealImpostersList');
        const actionsEl = document.getElementById('revealActions');

        setTimeout(() => {
            imposters.forEach((imp, index) => {
                setTimeout(() => {
                    const revealDiv = document.createElement('div');
                    revealDiv.className = 'reveal-imposter';
                    const counter = isMulti ? `<div style="font-size: 16px; color: #999; margin-bottom: 6px;">${index + 1} / ${total}</div>` : '';
                    revealDiv.innerHTML = `
                        ${counter}
                        <h2 style="font-size: 48px; color: #667eea;">🎭 ${escapeHtml(imp.name)}!</h2>
                    `;
                    listEl.appendChild(revealDiv);
                    AudioManager.playAlert();
                }, index * 1200);
            });

            setTimeout(() => {
                const continueBtn = document.createElement('button');
                continueBtn.className = 'btn btn-success';
                continueBtn.style.marginTop = '10px';
                continueBtn.innerHTML = `📊 ${t('showResults')}`;
                continueBtn.onclick = calculateResults;
                actionsEl.appendChild(continueBtn);

                Confetti.create();
            }, (total * 1200) + 400);
        }, 800);
    }

    // ===============================
    // SCORING
    // ===============================
    function calculateResults() {
        // Reverse mode: go to final-guess screen first, then come back
        if (currentGame.mode === 'reverse' && !currentGame._reverseFinalized) {
            showFinalGuessScreen();
            return;
        }

        const results = [];

        // Count votes against each player (from regular players only, excluding self-votes)
        const regularPlayerVoteCounts = {};
        currentSession.players.forEach(p => {
            regularPlayerVoteCounts[p.id] = 0;
        });

        allVotes.forEach(vote => {
            if (!vote.voterIsImposter && vote.voterId !== vote.votedFor && regularPlayerVoteCounts[vote.votedFor] !== undefined) {
                regularPlayerVoteCounts[vote.votedFor]++;
            }
        });

        const regularPlayersCount = currentSession.players.length - currentGame.imposterCount;

        currentSession.players.forEach(player => {
            let score = 0;
            let breakdown = [];
            const votesAgainst = regularPlayerVoteCounts[player.id] || 0;
            const isImposter = currentGame.imposters.includes(player.id);
            const isDoubleAgent = currentGame.doubleAgentId === player.id;
            const isFakeImposter = (currentGame.fakeImposterIds || []).includes(player.id);

            if (isImposter) {
                if (votesAgainst === 0) {
                    score = 30;
                    breakdown.push(`+30 (${t('noOneDoubtedYou')})`);
                } else if (votesAgainst < regularPlayersCount / 2) {
                    score = 20;
                    breakdown.push(`+20 (${t('fewDoubtedYou')})`);
                } else {
                    score = 0;
                    breakdown.push(`+0 (${t('youWereCaught')})`);
                }

                const playerVotes = allVotes.filter(v => v.voterId === player.id);
                playerVotes.forEach(vote => {
                    if (vote.votedFor === player.id) {
                        breakdown.push(`0 (${currentLang === 'ar' ? 'صوت لنفسه' : 'Voted for self'})`);
                        return;
                    }
                    const votedForIsImposter = currentGame.imposters.includes(vote.votedFor);
                    if (votedForIsImposter) {
                        score += 5;
                        breakdown.push(`+5 (${currentLang === 'ar' ? 'صوت لمحتال زميل' : 'Fellow imposter'})`);
                    } else {
                        score -= 5;
                        breakdown.push(`-5 (${t('wrongVoteOnInnocent')})`);
                    }
                });
            } else {
                const playerVotes = allVotes.filter(v => v.voterId === player.id);
                playerVotes.forEach(vote => {
                    if (vote.votedFor === player.id) return;
                    const votedForIsImposter = currentGame.imposters.includes(vote.votedFor);
                    if (votedForIsImposter) {
                        score += 10;
                        breakdown.push(`+10 (${t('correctVoteOnImposter')})`);
                    } else {
                        score -= 5;
                        breakdown.push(`-5 (${t('wrongVoteOnInnocent')})`);
                    }
                });

                // Double-agent bonus/penalty
                if (isDoubleAgent) {
                    const imposterEscaped = currentGame.imposters.some(id => (regularPlayerVoteCounts[id] || 0) < regularPlayersCount / 2);
                    if (imposterEscaped) {
                        score += 15;
                        breakdown.push(`+15 (${currentLang === 'ar' ? 'عميل مزدوج ناجح' : 'Double-agent helped imposter'})`);
                    } else if (votesAgainst >= regularPlayersCount / 2) {
                        score -= 10;
                        breakdown.push(`-10 (${currentLang === 'ar' ? 'العميل المزدوج كُشف' : 'Double-agent exposed'})`);
                    }
                }

                // Fake imposter: small bonus if not voted out
                if (isFakeImposter && votesAgainst < regularPlayersCount / 2) {
                    score += 5;
                    breakdown.push(`+5 (${currentLang === 'ar' ? 'محتال مزيف نجا' : 'Fake imposter survived'})`);
                }

                if (breakdown.length === 0) {
                    breakdown.push(`0`);
                }
            }

            const sessionPlayer = currentSession.players.find(p => p.id === player.id);
            if (sessionPlayer) {
                sessionPlayer.totalScore = (sessionPlayer.totalScore || 0) + score;
                sessionPlayer.gamesPlayed = (sessionPlayer.gamesPlayed || 0) + 1;
                sessionPlayer.stats = sessionPlayer.stats || emptyPlayerStats();
                sessionPlayer.stats.gamesPlayed = (sessionPlayer.stats.gamesPlayed || 0) + 1;
                if (isImposter) {
                    sessionPlayer.stats.timesImposter = (sessionPlayer.stats.timesImposter || 0) + 1;
                    if (votesAgainst >= regularPlayersCount / 2) {
                        sessionPlayer.stats.timesCaught = (sessionPlayer.stats.timesCaught || 0) + 1;
                    } else {
                        sessionPlayer.stats.timesEscaped = (sessionPlayer.stats.timesEscaped || 0) + 1;
                    }
                }
                const myVotes = allVotes.filter(v => v.voterId === player.id);
                myVotes.forEach(v => {
                    if (v.votedFor === player.id) return;
                    if (currentGame.imposters.includes(v.votedFor)) {
                        sessionPlayer.stats.correctVotes = (sessionPlayer.stats.correctVotes || 0) + 1;
                    } else {
                        sessionPlayer.stats.wrongVotes = (sessionPlayer.stats.wrongVotes || 0) + 1;
                    }
                });
            }

            results.push({
                id: player.id, name: player.name,
                avatar: sessionPlayer ? sessionPlayer.avatar : '',
                isImposter, isDoubleAgent, isFakeImposter,
                score, breakdown, votesAgainst
            });
        });

        currentGame.gameScores = results.map(r => ({ id: r.id, score: r.score }));

        const impostersCaught = currentGame.imposters.filter(id => {
            const votes = regularPlayerVoteCounts[id] || 0;
            return votes >= regularPlayersCount / 2;
        }).length;

        const regularsWon = impostersCaught >= currentGame.imposterCount / 2;
        // In reverse mode, the explicit guess determines the winner
        const finalRegularsWon = currentGame.mode === 'reverse'
            ? !!currentGame._reverseGuessCorrect
            : regularsWon;

        const winner = finalRegularsWon
            ? (currentLang === 'ar' ? 'اللاعبون العاديون' : 'Regular Players')
            : (currentLang === 'ar' ? 'المحتالون' : 'Imposters');

        // Update win streaks for each player
        currentSession.players.forEach(p => {
            const wasImp = currentGame.imposters.includes(p.id);
            const playerWon = (wasImp && !finalRegularsWon) || (!wasImp && finalRegularsWon);
            p.stats = p.stats || emptyPlayerStats();
            if (playerWon) {
                p.stats.wins = (p.stats.wins || 0) + 1;
                p.stats.currentWinStreak = (p.stats.currentWinStreak || 0) + 1;
                p.stats.maxWinStreak = Math.max(p.stats.maxWinStreak || 0, p.stats.currentWinStreak);
                p.stats.lossStreak = 0;
            } else {
                p.stats.currentWinStreak = 0;
                p.stats.lossStreak = (p.stats.lossStreak || 0) + 1;
            }
        });

        // Award random power-up to winners (50% chance to keep them rare)
        const winnerIds = currentSession.players.filter(p => {
            const wasImp = currentGame.imposters.includes(p.id);
            return (wasImp && !finalRegularsWon) || (!wasImp && finalRegularsWon);
        }).map(p => p.id);
        winnerIds.forEach(id => {
            if (Math.random() > 0.5) {
                const type = grantRandomPowerup(id);
                if (type) {
                    // Note: we don't toast here to avoid spamming; visible on session detail
                }
            }
        });

        // Achievements tracking
        const topScore = Math.max(...results.map(r => r.score));
        const uniqueNames = new Set(currentSession.players.map(p => p.name));
        const myStats = {
            language: currentLang,
            mode: currentGame.mode || 'classic',
            wasImposter: currentGame.imposters.length > 0,
            escapedAsImposter: !regularsWon && currentGame.imposters.length > 0,
            zeroVotesAgainst: results.some(r => r.isImposter && r.votesAgainst === 0),
            correctImposterVotes: results.reduce((sum, r) => {
                if (r.isImposter) return sum;
                const myVotes = allVotes.filter(v => v.voterId === r.id);
                return sum + myVotes.filter(v => currentGame.imposters.includes(v.votedFor)).length;
            }, 0),
            allVotesCorrect: false, // tracked via global streak elsewhere
            bestScore: topScore,
            uniquePlayersInSession: uniqueNames.size,
            correctReverseGuess: currentGame.mode === 'reverse' && currentGame._reverseGuessCorrect,
            lossStreak: 0
        };
        const newlyUnlocked = Achievements.recordGame(myStats);
        if (newlyUnlocked.length) Achievements.notifyUnlocks(newlyUnlocked);

        // Save history with mode
        currentSession.totalGames = (currentSession.totalGames || 0) + 1;
        if (!currentSession.gameHistory) currentSession.gameHistory = [];
        currentSession.gameHistory.push({
            timestamp: new Date().toISOString(),
            category: currentGame.category,
            imposterCount: currentGame.imposterCount,
            winner: winner,
            word: currentGame.word,
            mode: currentGame.mode || 'classic',
            difficulty: currentGame.difficulty || 'any'
        });

        Storage.saveSession(currentSession);

        // Truth or Dare prompt when imposter is caught in that mode
        if (currentGame.mode === 'truthOrDare' && !finalRegularsWon === false) {
            // Find the caught imposters
            const caught = currentGame.imposters.filter(id => (regularPlayerVoteCounts[id] || 0) >= regularPlayersCount / 2);
            if (caught.length) {
                const cp = currentSession.players.find(p => p.id === caught[0]);
                if (cp) {
                    setTimeout(() => openTruthOrDareFor(cp.name), 600);
                }
            }
        }

        showResults(results, winner);
    }

    // ===============================
    // REVERSE MODE - Final Guess
    // ===============================
    function showFinalGuessScreen() {
        showScreen('finalGuessScreen');
        const input = document.getElementById('finalGuessInput');
        if (input) input.value = '';
    }
    function submitFinalGuess() {
        const guess = (document.getElementById('finalGuessInput').value || '').trim().toLowerCase();
        const actualAr = String(currentGame._wordAr || currentGame.word || '').trim().toLowerCase();
        const actualEn = String(currentGame._wordEn || '').trim().toLowerCase();
        const correct = guess.length > 0 && (guess === actualAr || guess === actualEn || (actualAr && actualAr.includes(guess)) || (actualEn && actualEn.includes(guess)));
        currentGame._reverseGuessCorrect = correct;
        currentGame._reverseFinalized = true;
        if (correct) {
            Toast.success(t('correctGuess'));
            Confetti.create();
        } else {
            Toast.error(t('wrongGuess'));
        }
        // Now run normal calculateResults
        setTimeout(() => calculateResults(), 800);
    }

        if (playersWon) {
            Confetti.create();
        }

        const imposters = results.filter(r => r.isImposter);
        const sorted = [...results].sort((a, b) => b.score - a.score);
        const modeLabel = t('mode_' + (currentGame.mode || 'classic'));

        let html = `
            <div class="winner-banner" style="${!playersWon ? 'background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);' : ''}">
                ${playersWon ? `🎉 ${escapeHtml(t('playersWon'))}` : `😈 ${escapeHtml(t('impostersWon'))}`}
                <div style="font-size:14px;margin-top:6px;opacity:0.9;">${MODE_ICONS[currentGame.mode || 'classic'] || ''} ${escapeHtml(modeLabel)}</div>
            </div>

            <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; margin: 15px 0;">
                <h4 style="margin-bottom: 10px;">📝 ${escapeHtml(t('theWordWas'))}</h4>
                <div style="font-size: 28px; font-weight: bold; color: #667eea;">${escapeHtml(currentGame.word)}</div>
            </div>

            <h3 style="margin: 20px 0;">🎭 ${escapeHtml(t('imposters'))}</h3>
            ${imposters.map(i => `
                <div class="player-item" style="background: ${i.score > 0 ? '#e8f5e9' : '#ffebee'};">
                    <span class="player-name"><span class="avatar-display">${escapeHtml(i.avatar || '🎭')}</span>${escapeHtml(i.name)} 🎭</span>
                    <div style="text-align: ${currentLang === 'ar' ? 'left' : 'right'};">
                        <span style="color: #999; font-size: 12px; display: block;">
                            ${i.votesAgainst} ${escapeHtml(t('votesAgainst'))}
                        </span>
                        <span style="color: ${i.score > 0 ? '#4caf50' : '#ff0844'}; font-weight: bold;">
                            ${i.score >= 0 ? '+' : ''}${i.score} ${escapeHtml(t('point'))}
                        </span>
                    </div>
                </div>
            `).join('')}

            <h3 style="margin: 20px 0;">📊 ${escapeHtml(t('roundScores'))}</h3>
            <div class="score-list">
                ${sorted.map((player, index) => {
                    const rank = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    return `
                        <div class="score-item">
                            <span class="score-rank">${rank}</span>
                            <span class="score-name">
                                <span class="avatar-display">${escapeHtml(player.avatar || '🎭')}</span>${escapeHtml(player.name)}
                                ${player.isImposter ? '🎭' : ''}${player.isDoubleAgent ? ' 🕵️' : ''}${player.isFakeImposter ? ' 🎪' : ''}
                                <span class="score-breakdown">${escapeHtml(player.breakdown.join(' | '))}</span>
                            </span>
                            <span class="score-points" style="color: ${player.score >= 0 ? '#27ae60' : '#e74c3c'};">
                                ${player.score >= 0 ? '+' : ''}${player.score}
                            </span>
                        </div>
                    `;
                }).join('')}

            <h3 style="margin: 20px 0;">🏆 ${escapeHtml(t('totalRanking'))}</h3>

                ${[...currentSession.players]
                    .sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0))
                    .map((player, index) => {
                        const rank = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                        const totalScore = player.totalScore || 0;
                        return `
                            <div class="score-item">
                                <span class="score-rank">${rank}</span>

    function shareResults() {
        const imposters = currentGame.imposters.map(id => {
            const p = currentSession.players.find(pp => pp.id === id);
            return p ? p.name : '';
        }).filter(Boolean).join(', ');
        const top = [...currentSession.players].sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0))[0];
        const text = `🎭 ${t('title')} | ${t('word')}: ${currentGame.word} | 🎭: ${imposters} | 🥇 ${top ? top.name : ''}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => Toast.success(t('resultsShared')))
                .catch(() => Toast.info(text));
        } else {
            Toast.info(text);
        }
    }

    function playAgain() {
        // Preserve mode in session
        loadSessionDetail(currentSession.id);
    }

    // Abort the in-progress round and return to session detail without scoring.
    // Used by the End/Back buttons on first-player, card-reveal, discussion,
    // voting, and suspense screens.
    function abortCurrentRound() {
        showConfirm('❌ ' + t('abortRound'), t('abortRoundConfirm'), () => {
            if (bombInterval) { clearInterval(bombInterval); bombInterval = null; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            // Hide privacy overlay if showing
            const pscr = document.getElementById('privacyScreen');
            if (pscr) pscr.classList.remove('active');
            // Reset round-only state; keep session intact
            currentGame = null;
            currentPlayerIndex = 0;
            currentVoterIndex = 0;
            allVotes = [];
            currentVotes = [];
            selectedFirstPlayerIndex = -1;
            if (currentSession) {
                loadSessionDetail(currentSession.id);
            } else {
                showScreen('homeScreen');
            }
        });
    }

    function endSession() {
        if (bombInterval) { clearInterval(bombInterval); bombInterval = null; }
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        currentSession = null;
        currentGame = null;
        showScreen('sessionsScreen');
    }

        document.getElementById('customCatNameAr').value = cat.nameAr || '';
        document.getElementById('customCatNameEn').value = cat.nameEn || '';
        document.getElementById('customCatDifficulty').value = cat.difficulty || 'medium';
        document.getElementById('editCustomCatTitle').textContent = cat.nameAr || cat.nameEn || '';
        renderCustomWordsList();
        showScreen('editCustomCategoryScreen');
    }
    function addCustomWord() {
        const word = document.getElementById('customWordWord').value.trim();
        const hint = document.getElementById('customWordHint').value.trim();
        if (!word) { Toast.error(t('enterPlayerName')); return; }
        // Heuristic: contains Arabic letters?
        const isArabic = /[؀-ۿ]/.test(word);
        editingCustomWords.push({
            wordAr: isArabic ? word : '',
            wordEn: isArabic ? '' : word,
            hintAr: isArabic ? hint : '',
            hintEn: isArabic ? '' : hint
        });
        document.getElementById('customWordWord').value = '';
        document.getElementById('customWordHint').value = '';
        renderCustomWordsList();
    }
    function removeCustomWord(idx) {
        editingCustomWords.splice(idx, 1);
        renderCustomWordsList();
    }
    function renderCustomWordsList() {
        const list = document.getElementById('customWordsList');
        if (!editingCustomWords.length) {
            list.innerHTML = '';
            return;
        }
        list.innerHTML = editingCustomWords.map((w, i) => `
            <div class="player-item">
                <span class="player-name">${escapeHtml(w.wordAr || w.wordEn)} <span style="font-size:13px;color:#888;">— ${escapeHtml(w.hintAr || w.hintEn || '')}</span></span>
                <button class="delete-btn" data-idx="${i}">${escapeHtml(t('removeWord'))}</button>
            </div>
        `).join('');
        list.querySelectorAll('[data-idx]').forEach(b => b.onclick = () => removeCustomWord(parseInt(b.dataset.idx)));
    }
    function saveCustomCategory() {
        const nameAr = document.getElementById('customCatNameAr').value.trim();
        const nameEn = document.getElementById('customCatNameEn').value.trim();
        if (!nameAr && !nameEn) { Toast.error(t('categoryNeedName')); return; }
        if (editingCustomWords.length < 2) { Toast.error(t('categoryNeedWords')); return; }
        const cat = {
            id: editingCustomCatId || makeId(),
            nameAr, nameEn,
            difficulty: document.getElementById('customCatDifficulty').value,
            words: editingCustomWords
        };
        CustomCategories.upsert(cat);
        Toast.success(t('categorySaved'));
        updateCategorySelect();
        openManageCategories();
    }

    // ===============================
    // ACHIEVEMENTS SCREEN
    // ===============================
    let _achievementsReturn = 'home';
    function openAchievements() {
        _achievementsReturn = 'home';
        renderAchievementsScreen();
        showScreen('achievementsScreen');
    }
    function openSessionAchievements() {

        showScreen('achievementsScreen');

        if (_achievementsReturn === 'session' && currentSession) {

    function renderAchievementsScreen() {
        const data = Achievements.load();
        const total = ACHIEVEMENTS.length;
        const unlocked = Object.keys(data.unlocked || {}).length;
        document.getElementById('achievementsProgress').innerHTML = `
            <div class="winner-banner" style="font-size:18px;padding:14px;">
                ${escapeHtml(t('progress'))}: <strong>${unlocked}</strong> ${escapeHtml(t('of'))} <strong>${total}</strong>
            </div>
        `;
        const list = document.getElementById('achievementsList');
        list.innerHTML = ACHIEVEMENTS.map(a => {
            const isUnlocked = !!data.unlocked[a.id];
            return `
                <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
                    <div class="achievement-icon">${a.icon}</div>
                    <div class="achievement-info">
                        <div class="achievement-name">${escapeHtml(t('ach_' + a.id + '_name'))}</div>
                        <div class="achievement-desc">${escapeHtml(t('ach_' + a.id + '_desc'))}</div>
                    </div>
                    <div>${isUnlocked ? '🏆' : '🔒'}</div>
                </div>
            `;
        }).join('');
    }

    // ===============================
    // HALL OF FAME
    // ===============================
    function openHallOfFame() {
        const sessions = Storage.getSessions();
        // Aggregate stats by player name across sessions
        const byName = {};
        sessions.forEach(s => {
            (s.players || []).forEach(p => {
                const name = p.name;
                if (!byName[name]) {
                    byName[name] = {
                        name, avatar: p.avatar || '',
                        totalScore: 0, games: 0,
                        timesImposter: 0, timesEscaped: 0, correctVotes: 0,
                        wins: 0, maxWinStreak: 0
                    };
                }
                const agg = byName[name];
                agg.totalScore += (p.totalScore || 0);
                agg.games += (p.gamesPlayed || 0);
                const st = p.stats || {};
                agg.timesImposter += (st.timesImposter || 0);
                agg.timesEscaped += (st.timesEscaped || 0);
                agg.correctVotes += (st.correctVotes || 0);
                agg.wins += (st.wins || 0);
                agg.maxWinStreak = Math.max(agg.maxWinStreak, st.maxWinStreak || 0);
                if (p.avatar) agg.avatar = p.avatar;
            });
        });
        const list = Object.values(byName);
        if (list.length === 0) {
            document.getElementById('hallOfFameContent').innerHTML = `<div class="empty-state"><div class="empty-icon">⭐</div><div>${escapeHtml(t('noSessions'))}</div></div>`;
            showScreen('hallOfFameScreen');
            return;
        }
        const topGames = [...list].sort((a, b) => b.games - a.games)[0];
        const topImposter = [...list].sort((a, b) => b.timesEscaped - a.timesEscaped)[0];
        const topDet = [...list].sort((a, b) => b.correctVotes - a.correctVotes)[0];
        const topStreak = [...list].sort((a, b) => b.maxWinStreak - a.maxWinStreak)[0];
        const fmt = (p, value) => `<div class="hof-row"><span><span class="avatar-display">${escapeHtml(p.avatar || '🎭')}</span>${escapeHtml(p.name)}</span><strong>${value}</strong></div>`;
        document.getElementById('hallOfFameContent').innerHTML = `
            <div class="hof-section">
                <div class="hof-title">🎮 ${escapeHtml(t('mostGames'))}</div>
                ${fmt(topGames, topGames.games)}
            </div>
            <div class="hof-section">
                <div class="hof-title">🎭 ${escapeHtml(t('topImposter'))}</div>
                ${fmt(topImposter, topImposter.timesEscaped)}
            </div>
            <div class="hof-section">
                <div class="hof-title">🔍 ${escapeHtml(t('topDetective'))}</div>
                ${fmt(topDet, topDet.correctVotes)}
            </div>
            <div class="hof-section">
                <div class="hof-title">🔥 ${escapeHtml(t('longestStreak'))}</div>
                ${fmt(topStreak, topStreak.maxWinStreak)}
            </div>
        `;
        showScreen('hallOfFameScreen');
    }

    // ===============================
    // INITIALIZE
    // ===============================
    function initQuickStartButton() {
        const lastId = Storage.getRaw('imposterLastSessionId');
        const btn = document.getElementById('quickStartBtn');
        if (btn && lastId) {
            const exists = Storage.getSession(parseInt(lastId)) || Storage.getSession(lastId);
            btn.style.display = exists ? 'block' : 'none';

    // ===============================
    // HASAN VAULT UNLOCK FLOW
    // ===============================
    let _hasanUnlockOnSuccess = null;
    function promptHasanUnlock(onSuccess) {
        _hasanUnlockOnSuccess = onSuccess;
        const modal = document.getElementById('hasanUnlockModal');
        const input = document.getElementById('hasanPwdInput');
        const err = document.getElementById('hasanPwdError');
        input.value = '';
        err.textContent = '';
        modal.classList.add('active');
        setTimeout(() => input.focus(), 50);
    }
    async function _attemptHasanUnlock() {
        const input = document.getElementById('hasanPwdInput');
        const err = document.getElementById('hasanPwdError');
        const btn = document.getElementById('hasanUnlockBtn');
        const pwd = input.value;
        err.textContent = '';
        btn.disabled = true;
        const ok = await HasanVault.tryUnlock(pwd);
        btn.disabled = false;
        if (ok) {
            document.getElementById('hasanUnlockModal').classList.remove('active');
            if (typeof Toast !== 'undefined' && Toast.success) Toast.success(t('hasanUnlocked'));
            updateCategorySelect();
            const sel = document.getElementById('categorySelect');
            if (sel) sel.value = 'hasan';
            const cb = _hasanUnlockOnSuccess; _hasanUnlockOnSuccess = null;
            if (cb) cb();
        } else {
            err.textContent = t('hasanWrongPwd');
            input.select();
        }
    }

    // ===============================
    // EMAIL SIGNUP (Formspree)
    // ===============================
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xeendkrq';
    function shouldShowEmailSignup() {
        return !localStorage.getItem('imposterEmailAsked');
    }
    function markEmailAsked() {
        try { localStorage.setItem('imposterEmailAsked', '1'); } catch(e) {}
    }
    function showEmailSignup() {
        document.getElementById('emailSignupModal').classList.add('active');
        const input = document.getElementById('emailSignupInput');
        if (input) { input.value = ''; setTimeout(() => input.focus(), 50); }
        document.getElementById('emailSignupError').textContent = '';
    }
    async function _submitEmailSignup() {
        const input = document.getElementById('emailSignupInput');
        const err = document.getElementById('emailSignupError');
        const btn = document.getElementById('emailSignupSubmit');
        const email = (input.value || '').trim();
        err.textContent = '';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            err.textContent = t('emailSignupBadFormat');
            return;
        }
        btn.disabled = true;
        try {
            const res = await fetch(FORMSPREE_ENDPOINT, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    source: 'imposter-game',
                    lang: currentLang,
                    timestamp: new Date().toISOString()
                })
            });
            if (res.ok) {
                if (typeof Toast !== 'undefined' && Toast.success) Toast.success(t('emailSignupOk'));
                markEmailAsked();
                document.getElementById('emailSignupModal').classList.remove('active');
            } else {
                err.textContent = t('emailSignupFail');
            }
        } catch (e) {
            err.textContent = t('emailSignupFail');
        } finally {
            btn.disabled = false;
        }
    }
    function _skipEmailSignup() {
        markEmailAsked();
        document.getElementById('emailSignupModal').classList.remove('active');
    }

    window.addEventListener('load', () => {
        Theme.init();
        // Check for saved language preference
        const savedLang = localStorage.getItem('imposterGameLang');
        if (savedLang) {
            currentLang = savedLang;
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.toggle('en', savedLang === 'en');
            updateTranslations();
            updateCategorySelect();
            initQuickStartButton();
            showScreen('homeScreen');
            setTimeout(maybeShowWhatsNew, 600);
            // Offer email signup once, after the What's New modal has had time to settle
            if (shouldShowEmailSignup()) {
                setTimeout(() => {
                    if (!document.querySelector('.modal.active')) showEmailSignup();
                }, 2500);
            }
        } else {
            showScreen('langScreen');
        }

        // Wire Hasan unlock modal buttons
        const hUnlockBtn = document.getElementById('hasanUnlockBtn');
        const hCancelBtn = document.getElementById('hasanUnlockCancelBtn');
        const hInput = document.getElementById('hasanPwdInput');
        if (hUnlockBtn) hUnlockBtn.addEventListener('click', _attemptHasanUnlock);
        if (hCancelBtn) hCancelBtn.addEventListener('click', () => {
            document.getElementById('hasanUnlockModal').classList.remove('active');
            _hasanUnlockOnSuccess = null;
        });
        if (hInput) hInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') _attemptHasanUnlock();
        });

        // Wire email signup modal buttons
        const eSubmit = document.getElementById('emailSignupSubmit');
        const eSkip = document.getElementById('emailSignupSkip');
        const eInput = document.getElementById('emailSignupInput');
        if (eSubmit) eSubmit.addEventListener('click', _submitEmailSignup);
        if (eSkip) eSkip.addEventListener('click', _skipEmailSignup);
        if (eInput) eInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') _submitEmailSignup();
        });
    });
    
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.log('Error: ' + msg);
        return true;
    };
</script>
